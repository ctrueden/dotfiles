# Environment variables for every context, not just shells. This one file is
# both a systemd environment.d(5) drop-in (setup.sh links it into
# ~/.config/environment.d, so that desktop launchers, Alt+F2 and user services
# see it) and a POSIX sh fragment (lib/env.sh sources it for zsh and bash).
# See docs/environment.md for the reasoning.
#
# Note: Keep to plain KEY=value lines using ${VAR} and ${VAR:-default}: no
# export, quotes, $(...) or $DOTFILES, since the two parsers disagree on those.

XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-${HOME}/.config}
XDG_CACHE_HOME=${XDG_CACHE_HOME:-${HOME}/.cache}
XDG_DATA_HOME=${XDG_DATA_HOME:-${HOME}/.local/share}
XDG_STATE_HOME=${XDG_STATE_HOME:-${HOME}/.local/state}

# npm has no XDG support of its own. Only the cache moves: a context missing
# this merely grows a stray ~/.npm, whereas a missing credentials file
# (~/.npmrc) would fail publishing, so that stays where npm expects it.
npm_config_cache=${XDG_CACHE_HOME}/npm

# Go modules and tools; plugins/go.sh puts $GOPATH/bin on the PATH.
GOPATH=${XDG_DATA_HOME}/go

# Note: Bundler appends ruby/<ABI version> itself.
BUNDLE_PATH=${XDG_DATA_HOME}/bundle
