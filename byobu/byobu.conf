# Personal tmux settings particular to byobu, sourced after ../tmux/tmux.conf
# by the stub that setup.sh writes to ~/.config/byobu/.tmux.conf.
# Note: Byobu's own tools rewrite keybindings.tmux (e.g. byobu-ctrl-a),
# whereas .tmux.conf is left alone, so all customizations live there.

# Remember this directory, for sourcing the other files in it.
set -gF @byobu-dir "#{d:current_file}"

# Describe byobu's own bindings, for list-keys -N and the command palette.
source-file -qF "#{@byobu-dir}/notes.conf"

# Prefix + Shift+F12 toggles byobu's function keys (and its arrow-key combos)
# off and on, freeing them for programs like nvim. It replaces byobu's own
# plain Shift+F12 toggle, which has two problems. First, the outer of two
# nested sessions always catches Shift+F12, even after the inner session's
# prefix, leaving the inner session's toggle out of reach; whereas with the
# prefix, ^A Shift+F12 toggles the outer session and ^B Shift+F12 the inner.
# Second, re-enabling sources byobu's keybindings.tmux, clobbering the prefix
# keys set above; so here, fkeys-toggle.conf does the toggling instead.
unbind-key -n S-F12
bind-key -N "Toggle byobu function keys" S-F12 \
  source-file -F "#{@byobu-dir}/fkeys-toggle.conf"

# Flag in the status bar when byobu's function keys are off.
set -g status-left "#{?@fkeys-off,#[fg=$BYOBU_LIGHT bg=$BYOBU_HIGHLIGHT bold] F-KEYS OFF #[default],}#(byobu-status tmux_left)"

# Each status bar widget (see bin/) shows something to act on, and a key opens
# a window to act on it: a window rather than a popup, so other windows stay
# reachable meanwhile, and -S returns to that window when it is already open.
# The key's note explains the widget, so list-keys -N (prefix ?) answers
# "what does this mean?" for the whole status bar.

# Prefix + Q opens monoqueue's queue (widget 120_monoqueue). It runs on the
# monoqueue hub, where "mq up" runs: locally when this machine is the hub
# (it has the queue's status file), or else via ssh to $MONOQUEUE_HUB.
bind-key -N "Open the monoqueue (status: ⚠ alerts, ⚠stale updates, ⏰ due within a day)" Q \
  new-window -S -n queue 'if test -f ~/.local/share/monoqueue/status; then mq ui; else ssh -t "${MONOQUEUE_HUB:-worf}" bin/mq ui; fi'

# Prefix + R triages mr-tracked repos with mrcu (widget 600_dirty_repos).
bind-key -N "Triage mr-tracked repos with mrcu (status: ± repos needing a push)" R \
  new-window -S -n repos 'echo "Checking repos with mrcu; please wait..."; mrcu | less -R'
