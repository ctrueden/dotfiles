# Personal tmux settings particular to byobu, sourced after ../tmux.conf by
# the stub that setup.sh writes to ~/.config/byobu/.tmux.conf.
# Note: Byobu's own tools rewrite keybindings.tmux (e.g. byobu-ctrl-a),
# whereas .tmux.conf is left alone, so all customizations live there.

# Prefix + Space: command palette -- fuzzy-find any key binding and press it.
# Note: This replaces next-layout, which byobu also has on Shift+F8.
bind-key -N "Open the command palette" Space \
  display-popup -E -w 80% -h 60% '~/.config/byobu/palette.sh' \; \
  source-file -qF '#{d:socket_path}/palette-#{client_pid}'

# Describe byobu's own bindings, for list-keys -N and the command palette.
source-file -q "$BYOBU_CONFIG_DIR/notes.tmux"

# Over SSH, use Ctrl+B as the prefix instead of Ctrl+A, so that a session on a
# remote host, nested inside a local one, can be told apart: ^A drives the
# outer (local) session, and ^B the inner (remote) one. With this binding,
# ^B ^B sends an actual ^B to the terminal.
# Note: The tmux server inherits the environment of the client that started it.
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g prefix C-b
  unbind-key C-a
  bind-key -N "Send the prefix key (C-b)" C-b send-prefix
}

# Prefix + Shift+F12 toggles byobu's function keys (and its arrow-key combos)
# off and on, freeing them for programs like nvim. It replaces byobu's own
# plain Shift+F12 toggle, which has two problems. First, the outer of two
# nested sessions always catches Shift+F12, even after the inner session's
# prefix, leaving the inner session's toggle out of reach; whereas with the
# prefix, ^A Shift+F12 toggles the outer session and ^B Shift+F12 the inner.
# Second, re-enabling sources byobu's keybindings.tmux, clobbering the prefix
# keys set above; so here, fkeys-toggle.tmux does the toggling instead.
unbind-key -n S-F12
bind-key -N "Toggle byobu function keys" S-F12 \
  source-file "$BYOBU_CONFIG_DIR/fkeys-toggle.tmux"

# Flag in the status bar when byobu's function keys are off.
set -g status-left "#{?@fkeys-off,#[fg=$BYOBU_LIGHT bg=$BYOBU_HIGHLIGHT bold] F-KEYS OFF #[default],}#(byobu-status tmux_left)"
