# Personal tmux settings, for byobu, plain tmux, and psmux (tmux for Windows).
# Stubs source this file, then the settings particular to each:
# ~/.config/byobu/.tmux.conf sources ../byobu/byobu.conf, from setup.sh;
# ~/.tmux.conf sources fkeys.conf, from setup.sh; and
# ~/.psmux.conf sources fkeys.conf, from setup.ps1.

# Remember this directory, for finding the other files in it.
set -gF @tmux-dir "#{d:current_file}"

# Keep more scrollback per pane.
set -g history-limit 100000

# Enable mouse support.
set -g mouse on

# Note: byobu's default prefix key is F12. But I use plain F12
# as the show/hide hotkey for my terminal (Guake or iTerm2).
# So here, we map Ctrl+A as the prefix key instead.

# I like ctrl+A because:
# 1. it's easy to type on a QWERTY keyboard with one hand; and
# 2. I almost never use it to "increment number" in vim/nvim; and
# 3. I use vi mode at the shell prompt, so the Emacs "beginning of line"
#    shortcut can be accomplished with 0 in command mode instead.
set -g prefix C-a

# With the following binding, ^A ^A sends an actual ^A to the terminal;
# without it, it executes tmux's default bound command (last-window).
bind-key -N "Send the prefix key (C-a)" C-a send-prefix

# Ctrl+B, tmux's default, is reserved for sessions over SSH (see below),
# so that when they nest inside a local session, each level has its own prefix.
set -g prefix2 None

# Over SSH, use Ctrl+B as the prefix instead of Ctrl+A, so that a session on a
# remote host, nested inside a local one, can be told apart: ^A drives the
# outer (local) session, and ^B the inner (remote) one. With this binding,
# ^B ^B sends an actual ^B to the terminal.
# Note: tmux expands $SSH_CONNECTION as it reads this file, from the
# environment of the client that started the server, and -F tests the result
# without running a shell, which psmux on Windows might lack.
if-shell -F "$SSH_CONNECTION" {
  set -g prefix C-b
  unbind-key C-a
  bind-key -N "Send the prefix key (C-b)" C-b send-prefix
}

# Prefix + h: open the current pane's full scrollback in an editor.
# Note: capture-pane runs before new-window, so it targets the original pane.
# Note: nvim is preferred over $EDITOR, which is often unset in the tmux server,
# because nvim is where the clipboard is configured; vim is the fallback.
bind-key -N "Open the pane's scrollback in an editor" h \
  capture-pane -J -S - -b scrollback \; \
  new-window -n scrollback 'tmux save-buffer -b scrollback - | $(command -v nvim || echo vim) + -; tmux delete-buffer -b scrollback'

# Prefix + Space: command palette -- fuzzy-find any key binding and press it.
# Note: This replaces next-layout, which byobu also has on Shift+F8.
# Note: display-popup expands formats in -d but not in its command,
# so the popup starts in this directory to find palette.sh.
bind-key -N "Open the command palette" Space \
  display-popup -E -w 80% -h 60% -d '#{@tmux-dir}' './palette.sh' \; \
  source-file -qF '#{d:socket_path}/palette-#{client_pid}'

# Splits: override tmux's stock bindings so new panes keep the current CWD.
# In particular, `%` does not specify -c, -h, or -v in its default binding.
#
# * `|` and `%` match byobu's Ctrl+F2 (pane to the right).
# * `-` matches byobu's Shift+F2 (pane below).
#
# Yes, this makes `|` backwards from tmux's default,
# but the shape of the line is the pane divider visually!
bind-key -N "Split pane left/right" % split-window -h -c "#{pane_current_path}"
bind-key -N "Split pane left/right" | split-window -h -c "#{pane_current_path}"
bind-key -N "Split pane top/bottom" - split-window -v -c "#{pane_current_path}"
