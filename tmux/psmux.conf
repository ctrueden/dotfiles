# Overrides for psmux (tmux for Windows), where tmux.conf's way does not work.
# Sourced last by the stub that setup.ps1 writes to ~/.psmux.conf.

# Start from ^A as the prefix, leaving ^B over SSH to the client-attached hook.
# Note: psmux does not expand $SSH_CONNECTION in tmux.conf, so the test there
# sees the literal text, which is never empty, and always picks ^B.
set -g prefix C-a

# F8: rename the current window (see fkeys.conf), prompting in a popup.
# Note: psmux's command-prompt does nothing, and its own prompt, which
# prefix + , opens, is out of reach of other bindings.
bind-key -N "Rename current window" -n F8 \
  display-popup -E -w 60 -h 3 -d '#{@tmux-dir}' 'bash ./rename-window.bash'

# Prefix + Space: command palette (see tmux.conf).
# Note: psmux's display-popup returns before the popup closes, and its
# source-file lacks -F, so palette.sh runs the chosen binding itself (--run).
# Note: psmux runs popup commands in PowerShell, hence sh to run palette.sh.
bind-key -N "Open the command palette" Space \
  display-popup -E -w 80% -h 60% -d '#{@tmux-dir}' 'sh ./palette.sh --run'
