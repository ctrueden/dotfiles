# Byobu's most used function keys, for tmux without byobu: psmux (tmux for
# Windows), and plain tmux where byobu is missing. Sourced after tmux.conf by
# the stubs that setup.ps1 writes to ~/.psmux.conf, and setup.sh to
# ~/.tmux.conf; each stub also binds F5 to reload itself.

# Bind them with byobu's own descriptions (see ../byobu/notes.conf).

# Windows.
bind-key -N "Create a new window in the current directory" -n F2 new-window -c "#{pane_current_path}"
bind-key -N "Select the previous window" -n F3 previous-window
bind-key -N "Select the next window" -n F4 next-window
bind-key -N "Select the previous window" -n M-Left previous-window
bind-key -N "Select the next window" -n M-Right next-window
bind-key -N "Rename current window" -n F8 command-prompt -I "#W" "rename-window -- '%%'"

# Panes.
bind-key -N "Split pane left/right" -n C-F2 split-window -h -c "#{pane_current_path}"
bind-key -N "Split pane top/bottom" -n S-F2 split-window -v -c "#{pane_current_path}"
bind-key -N "Select the previous pane" -n S-F3 select-pane -t :.-
bind-key -N "Select the next pane" -n S-F4 select-pane -t :.+
bind-key -N "Select the pane above" -n S-Up select-pane -U
bind-key -N "Select the pane below" -n S-Down select-pane -D
bind-key -N "Select the pane to the left" -n S-Left select-pane -L
bind-key -N "Select the pane to the right" -n S-Right select-pane -R
bind-key -N "Zoom the current pane" -n S-F11 resize-pane -Z
bind-key -N "Kill the current pane" -n C-F6 kill-pane

# Sessions and scrollback.
bind-key -N "Detach the current client" -n F6 detach-client
bind-key -N "Enter copy mode" -n F7 copy-mode
