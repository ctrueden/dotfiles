# Fill the screen; on X11, GNOME's top bar stays visible.
edge center

# Translucent enough to read the window beneath.
background_opacity 0.75

# Note: On macOS, the main kitty imports the login shell's environment,
# but the quick-access instance does not, leaving Homebrew (and thus byobu)
# off the PATH of its shells.
kitty_override env=PATH=/opt/homebrew/bin:/usr/local/bin:${PATH}
