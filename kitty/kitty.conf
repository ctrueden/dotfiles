# Allow adjusting background_opacity on the fly:
# ctrl+shift+a then m (more), l (less), 1 (opaque) or d (default).
dynamic_background_opacity yes

# I'm old and I don't love squinting!
font_size 15.0

# Make the cursor fun. Whee!
cursor_shape block
cursor_shape_unfocused hollow
#cursor_beam_thickness 5
#cursor_underline_thickness 5.0
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_color yellow
